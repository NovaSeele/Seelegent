<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Seelegent</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Pre-paint: applies the saved appearance before the first frame, so there is no flash of the wrong theme,
      // font or size. Keys and ranges mirror src/config/prefs.ts (checked by src/prepaint.spec.ts). Only ids and
      // numbers are written: font ids select CSS stacks in styles/tokens.css, and the theme id must be one of the
      // palette files (the list is filled in at build time from src/styles/themes/*.css).
      ;(function () {
        var root = document.documentElement
        var themes = /*seelegent:themes*/ []
        var locales = ['vi', 'en', 'zh-CN', 'es', 'ko', 'ja', 'ru']
        function read(name) {
          try {
            var raw = window.localStorage.getItem('seelegent.v1.' + name)
            return raw === null ? null : JSON.parse(raw)
          } catch (e) {
            return null
          }
        }
        function matches(query) {
          try {
            return window.matchMedia(query).matches
          } catch (e) {
            return false
          }
        }
        function number(name, prop, min, max, unit) {
          var value = read(name)
          if (typeof value === 'number' && value >= min && value <= max) {
            root.style.setProperty(prop, value + unit)
          }
        }
        function id(name, attr) {
          var value = read(name)
          if (typeof value === 'string' && /^[a-z0-9-]{1,40}$/.test(value))
            root.setAttribute(attr, value)
        }
        var theme = read('ui.theme')
        if (themes.indexOf(theme) < 0) {
          theme = matches('(prefers-color-scheme: light)') ? 'seelegent-light' : 'seelegent-dark'
        }
        root.setAttribute('data-theme', theme)
        var motion = read('ui.motion')
        var reduce =
          motion === 'off' || (motion !== 'on' && matches('(prefers-reduced-motion: reduce)'))
        root.setAttribute('data-motion', reduce ? 'off' : 'on')
        id('ui.fontUi', 'data-font-ui')
        id('ui.fontMono', 'data-font-mono')
        number('ui.sizeUi', '--font-size-ui', 13, 16, 'px')
        number('ui.sizeTerm', '--font-size-term', 12, 17, 'px')
        number('ui.lineHeightTerm', '--line-height-term', 1.3, 1.9, '')
        number('layout.sidebarWidth', '--sidebar-width', 240, 560, 'px')
        var lang = read('ui.locale')
        if (locales.indexOf(lang) >= 0) root.setAttribute('lang', lang)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
